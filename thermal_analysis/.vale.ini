# Prose linter for the documentation: https://vale.sh
# Run "vale sync" once to download the styles, then "vale README.md docs/*.md".
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Thermal
Packages = Google, write-good

[*.md]
BasedOnStyles = Vale, Google, write-good
# British spelling is the project convention; Vale's spell checker is US English.
Vale.Spelling = NO
# Headings are sentence case; product and function names would trip these.
Google.Headings = NO
# Equations and code use symbols the following rules misread.
Google.Units = NO
write-good.E-Prime = NO
# British convention: no serial comma.
Google.OxfordComma = NO
# Flags technical words such as "maximum" and "with respect to".
write-good.TooWordy = NO
# Passive voice is reported, not counted as a warning.
write-good.Passive = suggestion
